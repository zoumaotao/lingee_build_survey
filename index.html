<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lingee-Build 生态伙伴 AI 需求调研</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f5f7ff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 进度条 */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #e8ecf5;
            z-index: 100;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.4s ease;
            width: 0%;
        }
        .progress-info {
            position: fixed;
            top: 12px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .progress-section {
            font-size: 12px;
            color: #667eea;
            font-weight: 600;
            background: #eef0ff;
            padding: 4px 10px;
            border-radius: 10px;
        }
        .progress-text {
            font-size: 12px;
            color: #999;
        }

        /* 主容器 */
        .survey-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 60px 20px 120px;
            min-height: 100vh;
        }

        /* 题目卡片 */
        .question-card {
            display: none;
            width: 100%;
            animation: slideIn 0.3s ease;
        }
        .question-card.active {
            display: block;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .q-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a2e;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .user-badge {
            font-size: 13px;
            color: #667eea;
            background: #f0f2ff;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 14px;
            margin-bottom: 16px;
        }

        .q-hint {
            font-size: 13px;
            color: #888;
            margin-bottom: 24px;
        }

        /* 选项按钮 */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .opt-btn {
            display: block;
            width: 100%;
            padding: 16px 20px;
            background: white;
            border: 2px solid #e8ecf5;
            border-radius: 12px;
            font-size: 15px;
            color: #333;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.5;
            -webkit-tap-highlight-color: transparent;
        }
        .opt-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .opt-btn:active {
            transform: scale(0.98);
        }
        .opt-btn.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
            font-weight: 500;
        }
        .opt-btn.selected-multi {
            border-color: #667eea;
            background: #eef0ff;
            color: #333;
            font-weight: 500;
            position: relative;
        }
        .opt-btn.selected-multi::after {
            content: '✓';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            font-weight: 700;
            font-size: 18px;
        }

        /* 其他输入 */
        .other-wrap {
            margin-top: 10px;
            display: none;
        }
        .other-wrap.show {
            display: block;
        }
        .other-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8ecf5;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .other-input:focus {
            border-color: #667eea;
        }

        /* 文本输入题 */
        .text-inputs {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .text-inputs input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8ecf5;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .text-inputs input:focus {
            border-color: #667eea;
        }

        /* 操作按钮 - 固定底部 */
        .actions {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 16px 20px;
            background: white;
            border-top: 1px solid #eee;
            max-width: 600px;
            margin: 0 auto;
            z-index: 50;
        }
        .btn-next {
            flex: 1;
            padding: 14px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-next:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(102,126,234,0.3);
        }
        .btn-next:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-prev {
            padding: 14px 20px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-prev:hover {
            background: #f8f9ff;
        }

        /* 欢迎页 & 结束页 */
        .welcome-card, .end-card {
            text-align: center;
            padding: 80px 20px 40px;
        }
        .welcome-card h1 {
            font-size: 24px;
            color: #1a1a2e;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .welcome-card p {
            font-size: 14px;
            color: #666;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        .btn-start {
            display: inline-block;
            padding: 16px 48px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
        }
        .end-card h2 {
            font-size: 28px;
            color: #4caf50;
            margin-bottom: 16px;
        }
        .end-card p {
            font-size: 15px;
            color: #666;
            line-height: 1.8;
        }

        .error-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #e53935;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            z-index: 200;
            animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translate(-50%, 10px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        @media (max-width: 500px) {
            .q-title { font-size: 18px; }
            .opt-btn { padding: 14px 16px; font-size: 14px; }
            .survey-container { padding: 50px 16px 90px; }
        }
    </style>
</head>
<body>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-info">
        <span class="progress-section" id="progressSection"></span>
        <span class="progress-text" id="progressText"></span>
    </div>

    <div class="survey-container" id="surveyContainer"></div>
    <div class="actions" id="actionsBar" style="display:none;">
        <button type="button" class="btn-prev" id="btnPrev" onclick="goPrev()">← 上一题</button>
        <button type="button" class="btn-next" id="btnNext" onclick="goNext()">下一题 →</button>
    </div>
    <div class="error-toast" id="errorToast"></div>

    <script src="app.js?v=6"></script>
</body>
</html>
